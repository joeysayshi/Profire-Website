    <div data-faq>
      <div class="qa rv"><button aria-expanded="false">Does my building need an AFSS?<span class="pl"></span></button><div class="ans"><div><p>If your building is required to submit an Annual Fire Safety Statement to Council, the owner must engage a competent Accredited Fire Safety Practitioner to oversee the process. Every property has its own Fire Safety Schedule listing the measures that must be installed and working.</p></div></div></div>
      <div class="qa rv"><button aria-expanded="false">How long do I have to submit it?<span class="pl"></span></button><div class="ans"><div><p>Council allows 90 days from the date of assessment (your annual fire safety inspection). If the AFSS isn't submitted by the due date, Council can issue fines weekly until it is. Our office team works to finish inspections, reporting and repairs with ample time to spare.</p></div></div></div>
      <div class="qa rv"><button aria-expanded="false">How often does fire safety equipment need testing?<span class="pl"></span></button><div class="ans"><div><p>Under Australian Standards, fire safety equipment must be thoroughly tested at least once a year. More complex systems such as fire panels, hydrant pumps and sprinkler pumps need monthly testing. Based on your Fire Safety Schedule, we'll advise which routine inspections your property needs.</p></div></div></div>
      <div class="qa rv"><button aria-expanded="false">What do I get after an inspection?<span class="pl"></span></button><div class="ans"><div><p>Our Head Certifiers review the results and send a photographic report and defect repair quote highlighting any failures found on site, using software built for the fire compliance industry.</p></div></div></div>

      <div class="qa rv"><button aria-expanded="false">Something's beeping after hours. Who do I call?<span class="pl"></span></button><div class="ans"><div><p>Call 02 9948 4494 any time and you'll be directed to our on-call After-Hours Technician. Call-outs are billed in addition to maintenance contracts, and after-hours rates apply. For a fire emergency, call 000.</p></div></div></div>
      <div class="qa rv"><button aria-expanded="false">Where do you work?<span class="pl"></span></button><div class="ans"><div><p>Across New South Wales: Bondi, Manly, Wollongong, the Northern Beaches, the Sutherland Shire, Sydney Metro, the Central Coast, Western Sydney and more.</p></div></div></div>

<template id="p-afss" data-title="The AFSS Process | Profire" data-label="The AFSS process">
<section class="phero"><div class="bg" data-speed="0.25"><img data-img="hero_afss" alt="Technician testing a fire panel"></div>
  <div class="wrap inner"><div class="crumb"><a href="#/">Home</a>/<a href="#/services">Services</a>/<span>AFSS</span></div><h1 class="split">The AFSS process.</h1><p class="lead">AFSS (Annual Fire Safety Statement) certification in Sydney and New South Wales. Our Accredited Fire Safety Practitioners are accredited without restriction to certify all fire safety measures on your AFSS.</p>
  <div class="hero-row" style="margin-top:28px"><div class="badges"><span><img data-img="fpas" alt="FPAS member"></span><span><img data-img="fpaa" alt="Gold member of FPAS"></span></div><a class="btn mag" href="#/contact" data-svc="AFSS Certification">Enquire <span class="arr">→</span></a></div></div></section>
<section class="sec">
  <div class="wrap two">
    <div class="sticky-head"><span class="eyebrow rv">What it involves</span><h2 class="split" style="margin:18px 0 28px">Every property has its own schedule.</h2><div class="ph-img clip" style="aspect-ratio:3/2"><img data-img="afss1" alt="The team working"></div></div>
    <div class="prose">
      <p class="rv">If your building or property is required to submit an Annual Fire Safety Statement to Council, you (the property owner) must engage a competent and <strong>Accredited Fire Safety Practitioner (AFSP)</strong> to oversee the AFSS process. The AFSP assesses the fire safety systems installed in your property and certifies that they reach the minimum standards of performance set out in Council's Fire Safety Schedule and AS1851.</p>
      <p class="rv">Each property is unique, so each has a unique <strong>Fire Safety Schedule</strong> (FSS), a list of fire safety equipment. These systems must be installed and operational for Council to be satisfied that the property and its occupants are adequately protected in a fire emergency.</p>
      <p class="rv">The AFSS process requires a complete fire safety inspection of all fire safety equipment in the property every year. Any defects or failures found during the routine inspection must be reported to the owners, who must resolve them before submitting the AFSS to Council.</p>
      <p class="rv">We specialise in facilitating the AFSS process for strata plans, commercial properties, hospitals, hotels and privately owned residential and commercial properties across NSW. We test all systems to AS1851, in conjunction with the minimum standards of performance on Fire Safety Schedules.</p>
      <p class="rv">See the full list of <a href="#/certifications">fire safety measures we can certify</a>.</p>
    </div>
  </div>
</section>
<section class="sec" style="padding-top:0">
  <div class="wrap">
    <div class="calc rv" data-calc>
      <div style="position:relative">
        <span class="eyebrow">Time-sensitive</span>
        <h2 style="margin-top:18px">90 days from assessment.</h2>
        <p>Council allows a 90-day window from the date of assessment to submit a complete AFSS. If it isn't submitted by the due date, Council can issue fines weekly until it is.</p>
        <p>Our office has dedicated staff whose focus is making sure all inspections, reporting and repairs are completed with ample time for you to submit and avoid fines.</p>
      </div>
      <div style="position:relative">
        <label for="calcD">Date of assessment (annual inspection)</label>
        <input type="date" id="calcD">
        <div class="calc-out">
          <div><div class="lbl">Submit to Council by</div><div class="flap xl" data-flap-id="due"></div></div>
          <div><div class="lbl">Days remaining</div><div class="flap xl pinkc" data-flap-id="left"></div></div>
          <div><span class="calc-status" id="calcS"><i></i><span>—</span></span></div>
          <div class="calc-acts"><a class="btn white mag" href="#/contact" data-svc="AFSS Certification">Talk to a team member <span class="arr">→</span></a><button class="btn ghost" style="color:#fff" id="calcIcs">Add reminder to calendar</button></div>
          <small>A guide only, based on the 90-day window. Your Council's notice is the final word.</small>
        </div>
      </div>
    </div>
  </div>
</section>
<section class="sec paper">
  <div class="wrap two" style="align-items:center">
    <div class="prose"><span class="eyebrow rv">Flexible &amp; affordable</span><h2 class="split" style="margin:18px 0 26px;font-size:clamp(30px,4vw,52px)">Meets Council standards. Fits your property.</h2><p class="rv">We pride ourselves on flexible, affordable fire safety solutions that make sure your building meets Council standards while taking the property owners' needs into account.</p><p class="rv">Get in touch today to talk to a team member about your Annual Fire Safety Statement.</p><a class="btn mag rv" href="#/contact" data-svc="AFSS Certification" style="margin-top:10px">Get in touch <span class="arr">→</span></a></div>
    <div class="ph-img clip" style="aspect-ratio:4/5;max-height:640px"><img data-img="afss2" alt="The team working"></div>
  </div>
</section>
%%CTA%%
</template>
